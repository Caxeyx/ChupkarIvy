[package]
name = "chupkarivy_session"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chupkarivy_config = { path = "../chupkarivy_config" }
chupkarivy_database = { path = "../chupkarivy_database" }
chupkarivy_player = { path = "../chupkarivy_player" }
chupkarivy_utils = { path = "../chupkarivy_utils" }

tokio = { version = "1.41.1", features = ["full"] }
librespot = { git = "https://github.com/librespot-org/librespot.git", tag = "v0.5.0", default-features = false }
serenity = "0.12.2"
songbird = { version = "0.4.4", features = ["simd-json"] }
anyhow = "1.0.93"
log = "0.4.22"
base64 = "0.22.1"
poise = "0.6.1"
thiserror = "2.0.3"
